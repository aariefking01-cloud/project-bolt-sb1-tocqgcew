<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#26292f" />
      <stop offset="45%" stop-color="#0e1013" />
      <stop offset="100%" stop-color="#050607" />
    </radialGradient>
    <linearGradient id="muscleOrange" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="40%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <circle cx="250" cy="250" r="245" fill="url(#centerGlow)" />

  <!-- Outer Yellow/Gold Ring -->
  <circle cx="250" cy="250" r="230" stroke="url(#goldRing)" stroke-width="22" fill="none" />
  <circle cx="250" cy="250" r="217" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.5" fill="none" />

  <!-- White Halo Ring behind traps -->
  <circle cx="250" cy="210" r="88" stroke="#ffffff" stroke-width="11" stroke-dasharray="42 22 75 22 42 22" fill="none" stroke-linecap="round" opacity="0.95" />

  <!-- White Wings (Left) -->
  <g fill="#ffffff" opacity="0.95">
    <polygon points="175,215 125,215 65,235 115,235" />
    <polygon points="180,243 140,243 85,263 125,263" />
    <polygon points="190,271 160,271 115,291 145,291" />

    <!-- White Wings (Right) -->
    <polygon points="325,215 375,215 435,235 385,235" />
    <polygon points="320,243 360,243 415,263 375,263" />
    <polygon points="310,271 340,271 385,291 355,291" />
  </g>

  <!-- Orange Biceps / Arms Flexing -->
  <g fill="url(#muscleOrange)" stroke="#0a0a0a" stroke-width="2.5" stroke-linejoin="round">
    <!-- Left Bicep and Shoulder -->
    <path d="M 175,215 C 160,210 145,195 140,175 C 135,150 145,130 165,125 C 180,120 200,135 205,150 C 210,165 205,185 195,195 C 185,205 178,212 175,215 Z" />
    <!-- Left Forearm -->
    <path d="M 148,155 C 135,145 125,140 120,150 C 115,160 125,175 140,182 C 152,190 165,185 168,175 C 170,165 160,160 148,155 Z" />
    <!-- Left Fist -->
    <path d="M 165,125 C 160,118 152,118 145,124 C 138,130 140,140 148,145 C 155,142 165,135 165,125 Z" />
    <path d="M 148,165 C 158,155 175,148 185,152" fill="none" stroke="#0a0a0a" stroke-width="3" />
    <path d="M 135,160 C 142,150 152,142 160,135" fill="none" stroke="#0a0a0a" stroke-width="2.5" />

    <!-- Right Bicep and Shoulder -->
    <path d="M 325,215 C 340,210 355,195 360,175 C 365,150 355,130 335,125 C 320,120 300,135 295,150 C 290,165 295,185 305,195 C 315,205 322,212 325,215 Z" />
    <!-- Right Forearm -->
    <path d="M 352,155 C 365,145 375,140 380,150 C 385,160 375,175 360,182 C 348,190 335,185 332,175 C 330,165 340,160 352,155 Z" />
    <!-- Right Fist -->
    <path d="M 335,125 C 340,118 348,118 355,124 C 362,130 360,140 352,145 C 345,142 335,135 335,125 Z" />
    <path d="M 352,165 C 342,155 325,148 315,152" fill="none" stroke="#0a0a0a" stroke-width="3" />
    <path d="M 365,160 C 358,150 348,142 340,135" fill="none" stroke="#0a0a0a" stroke-width="2.5" />
  </g>

  <!-- Torso & Silhouette (Black) -->
  <g fill="#0a0a0a">
    <path d="M 215,215 C 215,195 220,165 235,160 C 230,152 230,138 234,130 C 238,122 245,120 250,120 C 255,120 262,122 266,130 C 270,138 270,152 265,160 C 280,165 285,195 285,215 Z" />
    <path d="M 175,215 C 195,205 225,205 250,210 C 275,205 305,205 325,215 C 330,240 315,270 295,300 C 290,320 285,340 280,345 L 220,345 C 215,340 210,320 205,300 C 185,270 170,240 175,215 Z" />
  </g>

  <!-- Chest & 6-Pack Abs Lines -->
  <g stroke="#ffffff" stroke-width="1.8" opacity="0.35" fill="none" stroke-linecap="round">
    <path d="M 250,210 L 250,270" stroke-width="2.5" />
    <path d="M 205,220 C 220,245 245,245 250,240" stroke-width="2" />
    <path d="M 295,220 C 280,245 255,245 250,240" stroke-width="2" />
    <path d="M 250,270 L 250,335" stroke-width="2" />
    <path d="M 230,275 C 240,273 248,274 250,275 C 252,274 260,273 270,275" />
    <path d="M 232,295 C 242,293 248,294 250,295 C 252,294 258,293 268,295" />
    <path d="M 235,315 C 243,313 248,314 250,315 C 252,314 257,313 265,315" />
    <path d="M 226,275 C 224,295 222,315 220,335" />
    <path d="M 274,275 C 276,295 278,315 280,335" />
  </g>

  <!-- Typography -->
  <text x="250" y="384" text-anchor="middle" fill="#ffffff" font-family="'Oswald', 'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="34" letter-spacing="4">PUDUVAI</text>
  <text x="250" y="412" text-anchor="middle" fill="#ffffff" font-family="'Oswald', 'Montserrat', 'Arial Black', sans-serif" font-weight="800" font-size="21" letter-spacing="7">BOUNCERS</text>
</svg>
